# =========================
# AIRFLOW COMMON
# =========================
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: ./docker/airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/scripts
    - ./.kaggle:/home/airflow/.kaggle # untuk akses API Kaggle
  user: "50000:0"
  networks:
    - olist-net
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy


services:
  # =========================
  # AIRFLOW INIT (WAJIB)
  # =========================
  airflow-init:
    image: apache/airflow:2.8.1
    environment:
      <<: *airflow-common-env
    volumes:
      - .:/opt/airflow
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - olist-net
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname Admin --lastname User
      --role Admin --email admin@example.com"
    restart: "no"

  # =========================
  # AIRFLOW SERVICES
  # =========================
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    restart: always

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always

  # =========================
  # DATABASE
  # =========================
  postgres:
    image: postgres:13
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5
    restart: always
    networks:
      - olist-net

  # =========================
  # REDIS (Celery Broker)
  # =========================
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: always
    networks:
      - olist-net
    
  # =========================
  # KAFKA
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - olist-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - olist-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - olist-net

  metabase:
    image: metabase/metabase:latest
    container_name: olist-metabase
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_PORT: 3000
    volumes:
      - metabase_data:/metabase-data
    networks:
      - olist-net

  # =========================
  # SPARK (bisa disesuaikan dengan kebutuhan, contoh ini menggunakan Spark 3.5.0/bisa di hapus  dengan jupter sparkjika tidak diperlukan)
  # =========================
  spark-master:
    build: ./docker/spark
    image: custom-spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8082:8080"
    networks:
      - olist-net

  spark-worker:
    build: ./docker/spark
    image: custom-spark:3.5.0
    container_name: spark-worker
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    ports:
      - "8081:8081"
    networks:
      - olist-net

  # =========================
  # PYSPARK NOTEBOOK 
  # =========================
  
  pyspark-notebook:
    image: jupyter/pyspark-notebook:latest
    container_name: olist-pyspark-notebook
    depends_on:
      - postgres
      - kafka
    ports:
      - "8889:8888"
      - "4041:4040"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      GRANT_SUDO: "yes"
      SPARK_OPTS: "--packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3"
      DATA_PATH: /home/jovyan/work/data
      KAGGLE_CONFIG_DIR: /home/jovyan/work/.kaggle
    volumes:
      - ./:/home/jovyan/work
      - ./notebooks:/home/jovyan/notebooks # menyimpan notebook dari container ke storage lokal
      - ./data:/home/jovyan/data # membaca data dari folder data diluar container
      - ./.kaggle:/home/jovyan/work/.kaggle # untuk akses API Kaggle
    working_dir: /home/jovyan/work
    command: >
      bash -lc "
      pip install kafka-python pandas sqlalchemy psycopg2-binary findspark kaggle &&
      start-notebook.sh --NotebookApp.token=''
      "
    networks:
      - olist-net

volumes:
  postgres-db-volume:
  metabase_data:

networks:
  olist-net:
    driver: bridge